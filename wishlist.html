            transition: all .3s;
            border-radius: 10rem;
            z-index: -1;

        }

        &:hover {
            color: white;

<h1 class="title"><u>My Wishlist</u></h1>
<div id="wishlist-container"></div>
</div>














<script>
    const wishlistContainer = document.getElementById('wishlist-container');
    const userId = localStorage.getItem('userid'); 
let wishlist = JSON.parse(localStorage.getItem(`wishlist_${userId}`)) || [];


    function renderWishlist() {
        wishlistContainer.innerHTML = '';
        if (wishlist.length === 0) {
            wishlistContainer.innerHTML = '<p class="title1">No products in wishlist</p>';
            return;
        }
        wishlist.forEach(item => {
            const div = document.createElement('div');
            div.classList.add('wishlist-item');
            div.innerHTML = `
                <div class="box-box"></div>
                <img src="${item.image}" alt="${item.name}">
                <h3>${item.name}</h3>
                <p class="prices">₹${item.price}</p>
                <button class="remove" data-id="${item.id}">Remove</button>
                <a href="device.html"><button class="remove1">shop</button></a>
                
            `;
            wishlistContainer.appendChild(div);
        });
    }
wishlistContainer.addEventListener('click', function(e) {
    if (e.target.classList.contains('remove')) {
        const div = e.target.closest('.wishlist-item');
        div.classList.add('fade-out'); // add fade-out effect
        setTimeout(() => {
            const id = e.target.dataset.id;
            wishlist = wishlist.filter(item => String(item.id) !== id);
            localStorage.setItem(`wishlist_${userId}`, JSON.stringify(wishlist));
            renderWishlist();
        }, 300); // wait for CSS transition
    }
});



    renderWishlist();
</script>
